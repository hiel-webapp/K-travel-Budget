    <style>

            transition: all 0.2s ease;
            border-bottom: 2px dashed #c5c6ca;
            text-align: center;
            padding: 2px 8px;
            background: transparent;
            cursor: pointer;
        }
        .madlib-select:hover {
            background-color: #efeeec;
            border-bottom-color: #1A1C1E;
        }
        .madlib-select:focus {
            outline: none;
            border-bottom-color: #E55B4D;
            background-color: #efeeec;
        }

</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col pt-header-height">
    <!-- TopNavBar -->
    <header class="bg-surface dark:bg-surface-container-lowest fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-header-height border-b border-outline-variant">
        <div class="flex items-center gap-8">
            <a href="index.html" class="font-headline-lg text-headline-lg font-bold text-primary dark:text-primary-fixed">
                HypeHeritage
            </a>
            <!-- Desktop Navigation -->
            <nav class="hidden md:flex items-center space-x-8">
                <a class="text-on-surface-variant font-medium hover:text-secondary transition-colors font-label-md text-label-md" href="trend.html">K-트렌드</a>
                <a class="text-on-surface-variant font-medium hover:text-secondary transition-colors font-label-md text-label-md" href="meal_plan.html">K-가이드</a>
                <a class="text-on-surface-variant font-medium hover:text-secondary transition-colors font-label-md text-label-md" href="#">저장한 여행</a>
            </nav>
        </div>
        <!-- Trailing Actions -->
        <div class="flex items-center space-x-4">
            <button class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors">KO / EN</button>
            <button class="text-primary hover:opacity-80 transition-opacity">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">account_circle</span>
            </button>
        </div>
    </header>

    <!-- Main Content Canvas -->
    <main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-12 md:py-24 max-w-container-max mx-auto w-full">
        <!-- Hero Section -->
        <div class="text-center mb-16 space-y-4 max-w-3xl">
            <h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary tracking-tight">HypeHeritage</h1>
            <p class="font-body-lg text-body-lg text-on-surface-variant">현지인처럼 선택하고, 믿을 수 있게 예산을 세워보세요.</p>
        </div>

        <!-- Interactive Mad-libs Card -->
        <div class="bg-surface-container-lowest border border-outline-variant rounded-card p-6 md:p-12 w-full max-w-4xl shadow-soft hover:shadow-md transition-shadow duration-300">
            <div class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary leading-relaxed text-center mb-8 flex flex-wrap justify-center items-baseline gap-y-4 gap-x-2">
                <select id="select-cities" class="madlib-select text-brand-navy appearance-none border-t-0 border-l-0 border-r-0 rounded-none pr-6 focus:ring-0">
                    <option value="seoul_busan" selected>서울과 부산</option>
                    <option value="seoul">서울</option>
                    <option value="busan">부산</option>
                </select>
                <span>으로</span>
                <select id="select-nights" class="madlib-select text-brand-navy appearance-none border-t-0 border-l-0 border-r-0 rounded-none pr-6 focus:ring-0">
                    <option value="3">3박</option>
                    <option value="5" selected>5박</option>
                    <option value="7">7박</option>
                </select>
                <span>동안</span>
                <select id="select-people" class="madlib-select text-brand-navy appearance-none border-t-0 border-l-0 border-r-0 rounded-none pr-6 focus:ring-0">
                    <option value="1">성인 1명</option>
                    <option value="2" selected>성인 2명</option>
                    <option value="3">성인 3명</option>
                    <option value="4">성인 4명</option>
                </select>
                <span>이</span>
                <select id="select-budget" class="madlib-select text-brand-navy appearance-none border-t-0 border-l-0 border-r-0 rounded-none pr-6 focus:ring-0">
                    <option value="budget">실속형 예산</option>
                    <option value="standard" selected>스탠다드 예산</option>
                    <option value="premium">프리미엄 예산</option>
                </select>
                <span>으로 여행할 예정이에요.</span>
            </div>

            <div id="trip-distribution" class="text-center font-body-md text-body-md text-on-surface-variant mb-12">
                서울 3박 · 부산 2박
            </div>

            <div class="flex flex-col items-center gap-4">
                <button id="btn-submit" class="bg-brand-coral hover:opacity-90 text-on-primary font-label-md text-label-md font-bold py-4 px-8 rounded-lg shadow-sm hover:shadow-soft transition-all duration-200">
                    내 한국 여행 예산 만들기
                </button>
                <p class="font-body-sm text-body-sm text-outline">결제 없이 첫 번째 여행 예산을 만들어볼 수 있어요.</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-surface-container-low dark:bg-surface-container-highest w-full py-8 px-margin-mobile md:px-margin-desktop flex flex-col md:flex-row justify-between items-center gap-4 border-t border-outline-variant mt-auto">
        <div class="flex flex-col md:flex-row items-center gap-4 md:gap-8">
            <span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">HypeHeritage</span>
            <span class="font-body-sm text-body-sm text-on-surface-variant dark:text-on-surface-variant">© 2026 HypeHeritage. All rights reserved.</span>
            <div class="flex gap-4">
                <a class="font-label-sm text-label-sm text-on-surface-variant dark:text-on-surface-variant hover:text-secondary underline transition-opacity duration-150" href="#">Intro</a>
                <a class="font-label-sm text-label-sm text-on-surface-variant dark:text-on-surface-variant hover:text-secondary underline transition-opacity duration-150" href="#">Terms</a>
                <a class="font-label-sm text-label-sm text-on-surface-variant dark:text-on-surface-variant hover:text-secondary underline transition-opacity duration-150" href="#">Privacy</a>
            </div>
        </div>
        <div class="font-label-sm text-label-sm text-on-surface-variant dark:text-on-surface-variant">
            Region: 대한민국
        </div>
    </footer>

    <script>
        const selectCities = document.getElementById('select-cities');
        const selectNights = document.getElementById('select-nights');
        const selectPeople = document.getElementById('select-people');
        const selectBudget = document.getElementById('select-budget');
        const tripDistribution = document.getElementById('trip-distribution');
        const btnSubmit = document.getElementById('btn-submit');

        function updateDistribution() {
            const cities = selectCities.value;
            const nights = parseInt(selectNights.value, 10);
            
            if (cities === 'seoul') {
                tripDistribution.textContent = `서울 ${nights}박`;
            } else if (cities === 'busan') {
                tripDistribution.textContent = `부산 ${nights}박`;
            } else {
                // seoul_busan
                let seoul = 0;
                let busan = 0;
                if (nights === 3) {
                    seoul = 2; busan = 1;
                } else if (nights === 5) {
                    seoul = 3; busan = 2;
                } else {
                    seoul = 4; busan = 3;
                }
                tripDistribution.textContent = `서울 ${seoul}박 · 부산 ${busan}박`;
            }
        }

        selectCities.addEventListener('change', updateDistribution);
        selectNights.addEventListener('change', updateDistribution);

        // Initial setup
        updateDistribution();

        btnSubmit.addEventListener('click', () => {
            const citiesVal = selectCities.value;
            const nightsVal = parseInt(selectNights.value, 10);
            const peopleVal = parseInt(selectPeople.value, 10);
            const budgetVal = selectBudget.value;

            let seoulNights = 0;
            let busanNights = 0;
            let citiesArr = [];

            if (citiesVal === 'seoul') {
                seoulNights = nightsVal;
                citiesArr = ["Seoul"];
            } else if (citiesVal === 'busan') {
                busanNights = nightsVal;
                citiesArr = ["Busan"];
            } else {
                citiesArr = ["Seoul", "Busan"];
                if (nightsVal === 3) {
                    seoulNights = 2; busanNights = 1;
                } else if (nightsVal === 5) {
                    seoulNights = 3; busanNights = 2;
                } else {
                    seoulNights = 4; busanNights = 3;
                }
            }

            // Calculate budget goals
            let budgetGoal = 1500000; // Standard 2 adults
            if (budgetVal === 'budget') budgetGoal = 800000;
            if (budgetVal === 'premium') budgetGoal = 3000000;
            // Adjust based on people
            budgetGoal = Math.round(budgetGoal * (peopleVal / 2));

            const state = {
                cities: citiesArr,
                nights: nightsVal,
                seoulNights: seoulNights,
                busanNights: busanNights,
                people: peopleVal,
                budgetType: budgetVal,
                budgetGoal: budgetGoal,
                accommodationType: 'standard', // default choice
                hasCustomMeal: false,
                customMeal: '',
                customMealPortions: 0,
                customMealPrice: 0
            };

            localStorage.setItem('k_travel_state', JSON.stringify(state));
            window.location.href = 'meal_plan.html';
        });
    </script>
</body>
</html>
