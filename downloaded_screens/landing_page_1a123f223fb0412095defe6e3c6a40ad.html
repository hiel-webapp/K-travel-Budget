<div class="font-headline-lg text-headline-lg font-bold text-primary dark:text-primary-fixed">

<nav class="hidden md:flex items-center space-x-8">
<a class="text-on-surface-variant dark:text-on-surface-variant font-medium hover:text-secondary dark:hover:text-secondary-container transition-colors font-label-md text-label-md" href="#">K-트렌드</a>

</div>

<span>으로</span>

<span>이</span>
<button class="madlib-input border-b-2 border-outline-variant text-brand-navy pb-1 px-2 hover:border-brand-navy focus:outline-none focus:border-brand-navy bg-surface-container-lowest hover:bg-surface-container rounded-t-sm">스탠다드 예산</button>

<button class="bg-brand-coral hover:bg-secondary-container text-on-primary font-label-md text-label-md font-bold py-4 px-8 rounded-lg shadow-sm hover:shadow-soft transition-all duration-200">
